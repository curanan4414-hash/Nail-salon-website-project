<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทำเล็บ เอาสังคม | หน้าแรก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; background-color: #FFFDF0; }</style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-white/95 sticky top-0 z-40 border-b border-pink-100 shadow-sm p-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <span class="font-bold text-base text-pink-600">💅 ทำเล็บ เอาสังคม</span>
      <div class="flex gap-1.5 text-xs font-semibold">
        <a href="tracker.html" class="px-3 py-1.5 rounded-xl bg-pink-50 text-pink-600">🔍 เช็กคิว</a>
        <a href="booking.html" class="px-3 py-1.5 rounded-xl bg-pink-500 text-white shadow-sm">จองคิว ➜</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-5">
    <!-- Hero Profile -->
    <div class="bg-gradient-to-br from-purple-300 via-pink-300 to-yellow-200 rounded-3xl p-5 shadow-lg border-2 border-white text-center sm:text-left flex flex-col sm:flex-row items-center gap-4">
      <div class="w-20 h-20 rounded-full bg-white shadow-md border-2 border-yellow-200 flex flex-col items-center justify-center shrink-0">
        <span class="text-[10px] font-bold text-purple-600">ทำเล็บ</span>
        <span class="text-xs font-extrabold text-pink-500">เอาสังคม</span>
        <span class="text-[8px] bg-yellow-300 text-yellow-900 px-1 rounded-full font-bold">ม.พะเยา</span>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900">ทำเล็บ เอาสังคม <span class="bg-white/80 text-pink-600 text-[10px] px-2 py-0.5 rounded-full">รับคิวจองเท่านั้น</span></h1>
        <p class="text-xs text-slate-700 mt-0.5">ใกล้มหาวิทยาลัยพะเยา มีน้องแมวค่ะ 🐱 | โทร 0830567556</p>
        <p class="text-[11px] text-purple-900 font-medium">IG: ploy_.nailstudi1</p>
      </div>
    </div>

    <!-- รายการบริการและราคา -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-pink-100 space-y-3">
      <h2 class="text-base font-bold text-slate-800 flex items-center gap-1.5">
        <span>✨</span> รายการบริการ & อัตราค่าบริการ
      </h2>
      <div id="homeServiceList" class="space-y-2"></div>
      
      <a href="booking.html" class="block w-full text-center py-3 bg-gradient-to-r from-pink-500 to-purple-500 text-white rounded-2xl font-bold text-xs shadow-md shadow-pink-200 mt-4">
        กดจองคิวออนไลน์ตอนนี้ ➜
      </a>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    const container = document.getElementById('homeServiceList');
    const services = getServicesData();
    const categories = [...new Set(services.map(s => s.category))];

    categories.forEach(cat => {
      const header = document.createElement('p');
      header.className = 'text-xs text-purple-700 font-bold mt-2';
      header.innerText = `🌸 ${cat}`;
      container.appendChild(header);

      services.filter(s => s.category === cat).forEach(s => {
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center p-2.5 bg-pink-50/40 rounded-xl text-xs border border-pink-100/60';
        item.innerHTML = `
          <div>
            <span class="font-semibold text-slate-800 block">${s.name}</span>
            <span class="text-[10px] text-slate-400">ใช้เวลา ${s.duration} นาที</span>
          </div>
          <span class="font-bold text-pink-600">${s.price}.-</span>
        `;
        container.appendChild(item);
      });
    });
  </script>
</body>
</html>
