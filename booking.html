<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทำเล็บ เอาสังคม | จองคิวออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; background-color: #FFFDF0; }</style>
</head>
<body class="text-slate-800 min-h-screen p-4 pb-20">

  <div class="max-w-xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
      <a href="index.html" class="text-xs font-bold text-pink-600">← กลับหน้าแรก</a>
      <span class="text-xs font-bold text-slate-600">จองคิวออนไลน์</span>
    </div>

    <form id="bookingForm" onsubmit="event.preventDefault(); startLockAndDeposit();" class="bg-white rounded-3xl p-5 shadow-xl border border-pink-100 space-y-5">
      <!-- 1. เลือกบริการ (เลือกได้หลายอย่าง) -->
      <div>
        <h2 class="text-sm font-bold text-slate-800 mb-1">1. เลือกบริการ (ติ๊กได้หลายข้อ)</h2>
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-2.5 mb-2.5 flex justify-between text-xs">
          <span>⏱️ เวลารวมบล็อกคิว:</span>
          <span id="durationBadge" class="font-bold text-pink-600">0 นาที</span>
        </div>
        <div id="serviceSelectContainer" class="space-y-1.5"></div>
      </div>

      <!-- 2. เลือกวันและรอบเวลา -->
      <div class="border-t border-pink-100 pt-4 space-y-2">
        <h2 class="text-sm font-bold text-slate-800">2. เลือกวัน & รอบเวลา</h2>
        <input type="date" id="bookDate" required class="w-full px-3 py-2 text-xs bg-slate-50 border rounded-xl outline-none" onchange="renderSlots()">
        <span id="dayHint" class="text-[10px] text-purple-600 font-semibold block"></span>
        <div id="slotsGrid" class="grid grid-cols-2 gap-2"></div>
        <input type="hidden" id="selectedTime" required>
      </div>
      <!-- 3. ข้อมูลผู้จอง -->
      <div class="border-t border-pink-100 pt-4 space-y-2">
        <h2 class="text-sm font-bold text-slate-800">3. ข้อมูลติดต่อ & เรฟเล็บ</h2>
        <input type="text" id="custName" placeholder="ชื่อเล่น / ชื่อ-นามสกุล *" required class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
        <div class="grid grid-cols-2 gap-2">
          <input type="tel" id="custTel" placeholder="เบอร์โทรศัพท์ *" required class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
          <input type="text" id="custContact" placeholder="LINE / IG ID *" required class="w-full px-3 py-2 text-xs border rounded-xl outline-none">
        </div>
        <div>
          <label class="text-[11px] text-slate-500 block mb-1">แนบภาพเรฟลายเล็บ (Optional):</label>
          <input type="file" id="custRefFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:bg-pink-100 file:text-pink-700" onchange="previewRef(event)">
          <img id="refPreview" class="hidden max-h-24 mt-2 rounded-lg border">
        </div>
      </div>
      <div class="bg-pink-50 p-3 rounded-2xl text-xs space-y-1">
        <div class="flex justify-between"><span>ราคาประเมิน:</span><span id="priceDisplay" class="font-bold">0.-</span></div>
        <div class="flex justify-between font-bold text-pink-600 border-t border-pink-200 pt-1">
          <span>มัดจำล็อกคิว:</span><span>50.- (หักเต็มวันทำเล็บ)</span>
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-bold text-xs shadow-md">
        ไปหน้าชำระมัดจำ 50.- & ล็อกคิว ➜
      </button>
    </form>
  </div>

  <!-- Modal โอนมัดจำ 50.- & สลิป -->
  <div id="payModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3">
      <div class="text-center">
        <span class="text-xs font-bold text-pink-600">⏳ ล็อกคิวชั่วคราว: <span id="timer" class="font-mono">15:00</span></span>
        <h3 class="text-sm font-bold text-slate-800 mt-1">สแกนจ่ายมัดจำ 50.-</h3>
      </div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=PROMPTPAY-0830567556-50THB" class="w-32 h-32 mx-auto border p-1 rounded-lg">
      <p class="text-center text-xs font-bold">พร้อมเพย์: <span class="text-pink-600 font-mono">0830567556</span></p>
      
      <div>
        <label class="text-xs font-bold block mb-1">แนบสลิป 50 บาท *</label>
        <input type="file" id="slipFile" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:bg-pink-100 file:text-pink-700" onchange="previewSlip(event)">
      </div>

      <div class="flex gap-2 pt-1">
        <button type="button" onclick="closePayModal()" class="w-1/3 py-2 border rounded-xl text-xs">ยกเลิก</button>
        <button type="button" onclick="confirmBooking()" class="w-2/3 py-2 bg-pink-500 text-white rounded-xl text-xs font-bold">ยืนยันการจอง</button>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    let tempRefImg = '';
    let tempSlipImg = '';
    let currentLocked = null;

    // Render Services
    const container = document.getElementById('serviceSelectContainer');
    getServicesData().forEach(s => {
      const label = document.createElement('label');
      label.className = 'flex items-center justify-between p-2 border rounded-xl text-xs cursor-pointer hover:bg-pink-50/50';
      label.innerHTML = `
        <div class="flex items-center gap-2">
          <input type="checkbox" value="${s.id}" data-p="${s.price}" data-d="${s.duration}" data-n="${s.name}" class="chk-service accent-pink-500" onchange="onSelectChange()">
          <span>${s.name} <span class="text-slate-400">(+${s.duration} น.)</span></span>
        </div>
        <span class="font-bold text-pink-600">${s.price}.-</span>
      `;
      container.appendChild(label);
    });

    function onSelectChange() {
      let d = 0, p = 0;
      document.querySelectorAll('.chk-service:checked').forEach(c => {
        d += parseInt(c.dataset.d);
        p += parseInt(c.dataset.p);
      });
      document.getElementById('durationBadge').innerText = formatDuration(d);
      document.getElementById('priceDisplay').innerText = `${p}.-`;
      renderSlots();
    }

    function renderSlots() {
      const dateVal = document.getElementById('bookDate').value;
      const grid = document.getElementById('slotsGrid');
      const hint = document.getElementById('dayHint');
      if (!dateVal) return;

      const schedule = weeklyScheduleConfig[new Date(dateVal + 'T00:00:00').getDay()];
      hint.innerText = `${schedule.name}: เปิด ${schedule.text}`;

      let totalD = 0;
      document.querySelectorAll('.chk-service:checked').forEach(c => totalD += parseInt(c.dataset.d));
      if (totalD === 0) {
        grid.innerHTML = '<p class="col-span-2 text-xs text-slate-400 text-center py-2">กรุณาเลือกบริการก่อน</p>';
        return;
      }

      const activeBookings = getBookingsData().filter(b => b.date === dateVal && b.depositStatus !== 'cancelled');
      grid.innerHTML = '';

      for (let s = timeToMinutes(schedule.open); s + totalD <= timeToMinutes(schedule.close); s += 30) {
        const e = s + totalD;
        const overlap = activeBookings.some(b => s < timeToMinutes(b.endTime) && e > timeToMinutes(b.startTime));
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = overlap ? 'p-2 border rounded-xl text-[10px] bg-pink-50 text-pink-400 cursor-not-allowed' : 'p-2 border rounded-xl text-[10px] hover:border-pink-500';
        btn.disabled = overlap;
        btn.innerText = `${minutesToTime(s)} - ${minutesToTime(e)}`;
        if (!overlap) {
          btn.onclick = () => {
            document.getElementById('selectedTime').value = minutesToTime(s);
            Array.from(grid.children).forEach(c => c.classList.remove('bg-pink-500', 'text-white'));
            btn.classList.add('bg-pink-500', 'text-white');
          };
        }
        grid.appendChild(btn);
      }
    }

    function previewRef(e) {
      const file = e.target.files[0];
      if (file) {
        const r = new FileReader();
        r.onload = ev => {
          tempRefImg = ev.target.result;
          document.getElementById('refPreview').src = tempRefImg;
          document.getElementById('refPreview').classList.remove('hidden');
        };
        r.readAsDataURL(file);
      }
    }
    function previewSlip(e) {
      const file = e.target.files[0];
      if (file) {
        const r = new FileReader();
        r.onload = ev => tempSlipImg = ev.target.result;
        r.readAsDataURL(file);
      }
    }

    function startLockAndDeposit() {
      const selectedTime = document.getElementById('selectedTime').value;
      if (!selectedTime) return alert('กรุณาเลือกรอบเวลาค่ะ');

      let d = 0, p = 0, services = [];
      document.querySelectorAll('.chk-service:checked').forEach(c => {
        d += parseInt(c.dataset.d);
        p += parseInt(c.dataset.p);
        services.push(c.dataset.n);
      });

      currentLocked = {
        code: `#NL-${Math.floor(1000 + Math.random() * 9000)}`,
        name: document.getElementById('custName').value,
        tel: document.getElementById('custTel').value.replace(/[^0-9]/g, ''),
        contact: document.getElementById('custContact').value,
        date: document.getElementById('bookDate').value,
        startTime: selectedTime,
        endTime: minutesToTime(timeToMinutes(selectedTime) + d),
        duration: d,
        services: services,
        totalPrice: p,
        refImg: tempRefImg,
        rescheduledCount: 0
      };

      document.getElementById('payModal').classList.remove('hidden');
      document.getElementById('payModal').classList.add('flex');
    }
    function closePayModal() {
      document.getElementById('payModal').classList.add('hidden');
      document.getElementById('payModal').classList.remove('flex');
    }

    function confirmBooking() {
      if (!tempSlipImg) return alert('กรุณาแนบสลิป 50 บาทค่ะ');
      const bookings = getBookingsData();
      bookings.unshift({
        ...currentLocked,
        slipImg: tempSlipImg,
        depositStatus: 'pending_verify',
        statusText: 'รอช่างตรวจสลิป 50.-'
      });
      saveBookingsData(bookings);
      alert('จองสำเร็จ! กำลังพาไปหน้าเช็กสถานะ');
      window.location.href = `tracker.html?code=${currentLocked.code}`;
    }

    document.getElementById('bookDate').value = new Date().toISOString().split('T')[0];
  </script>
</body>
</html>
