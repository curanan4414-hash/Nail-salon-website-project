<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>จองคิวทำเล็บ - Nail Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-pink-50 min-h-screen p-6">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-pink-100 space-y-5">
    <div class="flex justify-between items-center border-b pb-3">
      <h1 class="text-xl font-bold text-pink-600">จองคิวทำเล็บ</h1>
      <a href="index.html" class="text-sm text-gray-500 hover:text-gray-700">กลับหน้าหลัก</a>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">เลือกบริการทำเล็บ</label>
      <div id="serviceList" class="space-y-2"></div>
    </div>

    <div class="bg-pink-50/50 p-4 rounded-xl text-sm space-y-1">
      <div class="flex justify-between"><span>ระยะเวลารวม:</span><b id="totalDuration">0 นาที</b></div>
      <div class="flex justify-between"><span>ราคาประเมิน:</span><b id="totalPrice">0 บาท</b></div>
      <div class="flex justify-between text-pink-600 font-semibold"><span>ยอดมัดจำ:</span><b>50 บาท</b></div>
    </div>

    <form onsubmit="handleBooking(event)" class="space-y-3">
      <div>
        <label class="block text-xs text-gray-600 mb-1">ชื่อลูกค้า</label>
        <input type="text" id="custName" required class="w-full border rounded-lg p-2 text-sm">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">เบอร์โทรศัพท์</label>
        <input type="tel" id="custPhone" required placeholder="เช่น 0812345678" class="w-full border rounded-lg p-2 text-sm">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">วันและเวลาที่ต้องการนัด</label>
        <input type="datetime-local" id="bookDateTime" required class="w-full border rounded-lg p-2 text-sm">
      </div>
      <div class="border-t pt-3">
        <label class="block text-xs text-gray-600 mb-1">สแกนชำระมัดจำ 50 บาท (พร้อมเพย์)</label>
        <!-- สามารถใส่รูปภาพ k.png ได้ที่นี่ -->
        <img src="k.png" alt="QR Code" class="w-32 h-32 mx-auto border rounded-lg object-cover mb-2" onerror="this.src='https://placehold.co/150x150?text=QR+50+THB'">
        <input type="file" required class="text-xs text-gray-500 block w-full">
      </div>
      <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white py-2.5 rounded-xl font-medium transition text-sm">ยืนยันการจองคิว</button>
    </form>
  </div>

  <script src="shared.js"></script>
  <script>
    const services = getServices();
    const serviceList = document.getElementById('serviceList');
    
    services.forEach(s => {
      serviceList.innerHTML += `
        <label class="flex items-center justify-between p-2.5 border rounded-lg cursor-pointer hover:bg-pink-50">
          <div class="flex items-center gap-2">
            <input type="checkbox" value="${s.id}" data-price="${s.price}" data-duration="${s.duration}" onchange="calcTotal()" class="service-checkbox rounded text-pink-600">
            <span class="text-sm font-medium text-gray-800">${s.name} (${s.duration} นาที)</span>
          </div>
          <span class="text-sm text-pink-600 font-semibold">${s.price} ฿</span>
        </label>
      `;
    });

    let currentPrice = 0;
    function calcTotal() {
      const checked = document.querySelectorAll('.service-checkbox:checked');
      let price = 0, duration = 0;
      checked.forEach(c => {
        price += parseFloat(c.dataset.price);
        duration += parseInt(c.dataset.duration);
      });
      currentPrice = price;
      document.getElementById('totalPrice').innerText = `${price} บาท`;
      document.getElementById('totalDuration').innerText = `${duration} นาที`;
    }

    function handleBooking(e) {
      e.preventDefault();
      const checked = Array.from(document.querySelectorAll('.service-checkbox:checked'));
      if (checked.length === 0) return alert('กรุณาเลือกบริการอย่างน้อย 1 รายการ');

      const bookings = getBookings();
      const newBooking = {
        id: "BK-" + Date.now().toString().slice(-4),
        customerName: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value.trim(),
        serviceIds: checked.map(c => parseInt(c.value)),
        serviceNames: checked.map(c => c.parentElement.innerText.trim()).join(", "),
        totalPrice: currentPrice,
        deposit: 50,
        dateTime: document.getElementById('bookDateTime').value,
        status: "รอยืนยัน"
      };
      bookings.push(newBooking);
      saveBookings(bookings);
      alert(`จองคิวสำเร็จ! รหัสการจอง: ${newBooking.id}`);
      window.location.href = "tracker.html";
    }
  </script>
</body>
</html>
