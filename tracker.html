<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เช็กสถานะคิว - Nail Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-pink-50 min-h-screen p-6">
  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-pink-100 space-y-4">
    <div class="flex justify-between items-center border-b pb-2">
      <h1 class="text-lg font-bold text-gray-800">เช็กสถานะคิว (ID 6)</h1>
      <a href="index.html" class="text-xs text-gray-500 hover:text-gray-700">หน้าหลัก</a>
    </div>

    <div class="flex gap-2">
      <input type="text" id="phoneInput" placeholder="กรอกเบอร์โทรศัพท์" value="0812345678" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-pink-500">
      <button onclick="search()" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-medium">ค้นหา</button>
    </div>

    <div id="resultContainer" class="space-y-3 pt-2"></div>
  </div>

  <script src="shared.js"></script>
  <script>
    function search() {
      const phone = document.getElementById('phoneInput').value.trim();
      const bookings = getBookings().filter(b => b.phone === phone);
      const container = document.getElementById('resultContainer');
      container.innerHTML = '';

      if (bookings.length === 0) {
        container.innerHTML = `<p class="text-xs text-red-500 text-center">ไม่พบคิวที่ตรงกับเบอร์โทรนี้</p>`;
        return;
      }

      bookings.forEach(b => {
        container.innerHTML += `
          <div class="bg-pink-50/70 border border-pink-200 rounded-xl p-3.5 text-xs space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="font-bold text-gray-700">${b.id}</span>
              <span class="px-2 py-0.5 rounded text-[11px] font-medium ${b.status === 'ยืนยันแล้ว' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${b.status}</span>
            </div>
            <div>ชื่อ: <b>${b.customerName}</b></div>
            <div>บริการ: ${b.serviceNames}</div>
            <div>เวลานัด: <b class="text-pink-600">${b.dateTime.replace('T', ' ')} น.</b></div>
            <div class="pt-2 text-right">
              <a href="reschedule.html?id=${b.id}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-[11px]">ขอเลื่อนคิว</a>
            </div>
          </div>
        `;
      });
    }
    search();
  </script>
</body>
</html>
