<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทำเล็บ เอาสังคม | ตรวจสอบสถานะคิว</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; background-color: #FFFDF0; }</style>
</head>
<body class="text-slate-800 min-h-screen p-4 pb-20">

  <div class="max-w-xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
      <a href="index.html" class="text-xs font-bold text-pink-600">← หน้าแรก</a>
      <a href="booking.html" class="text-xs font-bold text-purple-600">+ จองคิวใหม่</a>
    </div>

    <div class="bg-white rounded-3xl p-5 shadow-xl border border-pink-100 space-y-3">
      <h1 class="text-base font-bold text-slate-800 text-center">🔍 ค้นหาสถานะการจองคิว</h1>
      <div class="flex gap-2">
        <input type="text" id="searchInput" placeholder="รหัสคิว (#NL-...) หรือ เบอร์โทร" class="flex-1 px-3 py-2 text-xs border rounded-xl outline-none">
        <button onclick="search()" class="px-4 py-2 bg-pink-500 text-white rounded-xl text-xs font-bold">ค้นหา</button>
      </div>

      <div id="results" class="space-y-3 pt-2"></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    function search() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const res = document.getElementById('results');
      if (!q) return res.innerHTML = '<p class="text-xs text-slate-400 text-center">กรุณากรอกรหัสคิวหรือเบอร์โทร</p>';

      const matched = getBookingsData().filter(b => b.code.toLowerCase().includes(q) || b.tel.includes(q));
      if (matched.length === 0) return res.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">ไม่พบคิวการจอง</p>';

      res.innerHTML = '';
      matched.forEach(b => {
        const canAction = b.depositStatus !== 'cancelled' && b.depositStatus !== 'completed';
        const card = document.createElement('div');
        card.className = 'p-4 rounded-2xl border border-pink-100 bg-pink-50/40 text-xs space-y-2';
        card.innerHTML = `
          <div class="flex justify-between items-center border-b pb-1.5">
            <span class="font-bold text-slate-800">${b.name} (${b.code})</span>
            <span class="font-bold text-pink-600">${b.statusText}</span>
          </div>
          <p>📅 <strong>วันเวลา:</strong> ${b.date} เวลา ${b.startTime} - ${b.endTime} น.</p>
          <p>💅 <strong>บริการ:</strong> ${b.services.join(' + ')} (บล็อก ${formatDuration(b.duration)})</p>
          <p>💸 <strong>มัดจำ:</strong> 50.- (หักวันทำเล็บ)</p>
          ${canAction ? `
            <div class="pt-1.5 border-t border-pink-200 flex gap-2">
              <a href="reschedule.html?code=${b.code}" class="flex-1 text-center py-1.5 bg-purple-500 text-white rounded-xl font-bold">🗓️ ขอเลื่อนคิว</a>
              <button onclick="cancelBooking('${b.code}')" class="px-3 py-1.5 border border-rose-300 text-rose-600 rounded-xl font-bold">✕ ยกเลิก</button>
            </div>
          ` : ''}
        `;
        res.appendChild(card);
      });
    }

    function cancelBooking(code) {
      if (confirm(`ยกเลิกคิว ${code} ใช่หรือไม่?\n(มัดจำ 50 บาทไม่สามารถคืนได้ค่ะ)`)) {
        const data = getBookingsData();
        const target = data.find(b => b.code === code);
        if (target) {
          target.depositStatus = 'cancelled';
          target.statusText = 'ลูกค้ายกเลิกคิวแล้ว';
          saveBookingsData(data);
          search();
        }
      }
    }

    // Auto-search from URL param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('code')) {
      document.getElementById('searchInput').value = urlParams.get('code');
      search();
    }
  </script>
</body>
</html>
