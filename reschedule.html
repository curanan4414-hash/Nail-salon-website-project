<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทำเล็บ เอาสังคม | เลื่อนคิว</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; background-color: #FFFDF0; }</style>
</head>
<body class="text-slate-800 min-h-screen p-4 pb-20">

  <div class="max-w-md mx-auto space-y-4">
    <a href="tracker.html" class="text-xs font-bold text-pink-600">← กลับหน้าเช็กสถานะ</a>

    <div class="bg-white rounded-3xl p-5 shadow-xl border border-pink-100 space-y-3">
      <h1 class="text-base font-bold text-slate-800">🗓️ ขอเลื่อนวันและเวลาคิว</h1>
      <p id="codeDisplay" class="text-xs text-pink-600 font-bold"></p>
      <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200 text-[11px] text-amber-900">
        ⚠️ เลื่อนได้ 1 ครั้ง และต้องแจ้งล่วงหน้าอย่างน้อย 2 ชั่วโมงค่ะ
      </div>

      <form onsubmit="event.preventDefault(); submitReschedule();" class="space-y-3">
        <div>
          <label class="text-xs font-semibold block mb-1">เลือกวันที่ใหม่:</label>
          <input type="date" id="newDate" required class="w-full px-3 py-2 text-xs border rounded-xl outline-none" onchange="renderRescheduleSlots()">
        </div>
        <div>
          <label class="text-xs font-semibold block mb-1">เลือกรอบเวลาใหม่:</label>
          <div id="newSlots" class="grid grid-cols-2 gap-1.5"></div>
          <input type="hidden" id="selectedNewTime" required>
        </div>
        <button type="submit" class="w-full py-2.5 bg-purple-500 text-white rounded-xl text-xs font-bold shadow-md">
          ยืนยันการเลื่อนคิว ✨
        </button>
      </form>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const code = new URLSearchParams(window.location.search).get('code');
    const booking = getBookingsData().find(b => b.code === code);

    if (!booking) {
      alert('ไม่พบคิวการจอง');
      window.location.href = 'tracker.html';
    }

    if ((booking.rescheduledCount || 0) >= 1) {
      alert('คิวนี้เคยใช้สิทธิ์เลื่อนไปแล้ว 1 ครั้ง (สูงสุด 1 ครั้งตามกฎร้าน)');
      window.location.href = 'tracker.html';
    }

    document.getElementById('codeDisplay').innerText = `รหัสคิว: ${booking.code} (${booking.name}) • บล็อก ${formatDuration(booking.duration)}`;

    function renderRescheduleSlots() {
      const dVal = document.getElementById('newDate').value;
      const grid = document.getElementById('newSlots');
      if (!dVal) return;

      const schedule = weeklyScheduleConfig[new Date(dVal + 'T00:00:00').getDay()];
      const activeBookings = getBookingsData().filter(b => b.date === dVal && b.code !== booking.code && b.depositStatus !== 'cancelled');
      const totalD = booking.duration;

      grid.innerHTML = '';
      for (let s = timeToMinutes(schedule.open); s + totalD <= timeToMinutes(schedule.close); s += 30) {
        const e = s + totalD;
        const overlap = activeBookings.some(b => s < timeToMinutes(b.endTime) && e > timeToMinutes(b.startTime));
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = overlap ? 'p-1.5 border rounded-xl text-[10px] bg-pink-50 text-pink-400 cursor-not-allowed' : 'p-1.5 border rounded-xl text-[10px] hover:border-purple-500';
        btn.disabled = overlap;
        btn.innerText = `${minutesToTime(s)} - ${minutesToTime(e)}`;
        if (!overlap) {
          btn.onclick = () => {
            document.getElementById('selectedNewTime').value = minutesToTime(s);
            Array.from(grid.children).forEach(c => c.classList.remove('bg-purple-500', 'text-white'));
            btn.classList.add('bg-purple-500', 'text-white');
          };
        }
        grid.appendChild(btn);
      }
    }

    function submitReschedule() {
      const nTime = document.getElementById('selectedNewTime').value;
      const nDate = document.getElementById('newDate').value;
      if (!nTime) return alert('กรุณาเลือกรอบเวลาใหม่ค่ะ');

      const data = getBookingsData();
      const target = data.find(b => b.code === code);
      if (target) {
        target.date = nDate;
        target.startTime = nTime;
        target.endTime = minutesToTime(timeToMinutes(nTime) + target.duration);
        target.rescheduledCount = (target.rescheduledCount || 0) + 1;
        target.statusText = `เลื่อนนัดเป็น ${nDate} (${nTime} น.)`;
        saveBookingsData(data);
        alert('เลื่อนคิวสำเร็จแล้วค่ะ!');
        window.location.href = `tracker.html?code=${code}`;
      }
    }
  </script>
</body>
</html>
