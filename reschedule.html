<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ขอเลื่อนคิว - Nail Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-pink-50 min-h-screen p-6">
  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-pink-100 space-y-4">
    <div class="flex justify-between items-center border-b pb-2">
      <h1 class="text-lg font-bold text-gray-800">ขอเลื่อนวันเวลานัดหมาย (ID 6)</h1>
      <a href="tracker.html" class="text-xs text-gray-500 hover:text-gray-700">กลับ</a>
    </div>

    <div class="text-xs text-gray-600 bg-gray-50 p-3 rounded-lg space-y-1">
      <div>รหัสการจอง: <b id="bookIdText">-</b></div>
      <div>ชื่อลูกค้า: <span id="nameText">-</span></div>
      <div>เวลานัดเดิม: <b id="oldTimeText" class="text-red-500">-</b></div>
    </div>

    <form onsubmit="handleReschedule(event)" class="space-y-3">
      <div>
        <label class="block text-xs text-gray-700 font-medium mb-1">เลือกวันและเวลาใหม่</label>
        <input type="datetime-local" id="newDateTime" required class="w-full border rounded-lg p-2 text-xs">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-xs font-medium transition">ยืนยันขอเลื่อนคิว</button>
    </form>
  </div>

  <script src="shared.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('id') || "BK-001";
    const bookings = getBookings();
    const current = bookings.find(b => b.id === bookingId);

    if (current) {
      document.getElementById('bookIdText').innerText = current.id;
      document.getElementById('nameText').innerText = current.customerName;
      document.getElementById('oldTimeText').innerText = current.dateTime.replace('T', ' ') + " น.";
    }

    function handleReschedule(e) {
      e.preventDefault();
      const newTime = document.getElementById('newDateTime').value;
      if (current) {
        current.dateTime = newTime;
        saveBookings(bookings);
        alert('เลื่อนเวลานัดหมายเรียบร้อยแล้ว!');
        window.location.href = "tracker.html";
      }
    }
  </script>
</body>
</html>
